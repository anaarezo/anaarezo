<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">Ana Arezo, Mobile Engineer</title>
<desc id="d">A grindhouse film title card in black, yellow and red, beside a code panel. React Native and Expo for mobile, and React for the web. 16+ years.</desc>
<defs><clipPath id="r"><rect width="1000" height="360" rx="14"/></clipPath>
