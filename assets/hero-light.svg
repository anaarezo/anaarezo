.c{font:700 13px 'Courier New',Courier,ui-monospace,monospace;fill:#f5c518}.s{fill:#fff1c2}.k{fill:#ff6a5e}.p{fill:#f5c518}
.f{font:400 20px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.08em;fill:#f5c518}.fm{font:700 12px 'Courier New',Courier,ui-monospace,monospace;fill:#f5c518}
.b1{font:400 30px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;fill:#fff}.b2{font:400 13px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.1em;fill:#fff}
.lt{font:400 72px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;fill:#f5c518;letter-spacing:.03em}.ls{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.4em;fill:#f5efd8}
.wr,.cur{opacity:0}.ld{display:none}.st{transform-origin:912px 286px}.ng{transform-origin:48px 170px}.rb{transform-origin:48px 210px}.bn{transform-origin:500px 180px}
@media (prefers-reduced-motion:no-preference){
.wr{animation:wr .36s steps(1) infinite}
.fk{animation:fk 4s steps(7) infinite}
.ld{display:inline;animation:ldout .15s linear 2.5s forwards}
.lf{animation:lf .3s steps(2) infinite}
.bn{animation:bn .55s ease-in 2s both}
.ng{animation:slam .3s cubic-bezier(.2,.9,.3,1) 2.65s both}
.hit{animation:hit .35s steps(5) 2.9s}
.e{animation:in .3s steps(3) 2.95s both}
.rb{animation:sl .3s ease-out 3s both}
.h3{animation:in .3s steps(3) 3.2s both}.h4{animation:in .3s steps(3) 3.35s both}
.ty{animation-name:ty;animation-fill-mode:both}
.st{animation:stamp .3s cubic-bezier(.2,.9,.3,1) 8.06s both,wob 3s ease-in-out 8.36s infinite}
.cur{animation:bl 1s linear 8.06s infinite}
.jump{animation:jump 11s steps(1) 4s infinite}
@keyframes wr{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes fk{0%,100%{opacity:1}40%{opacity:.9}70%{opacity:.96}}
@keyframes ldout{to{opacity:0;visibility:hidden}}
@keyframes lf{50%{opacity:.72}}
@keyframes bn{from{transform:scale(0)}to{transform:scale(9)}}
@keyframes slam{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:none}}
@keyframes hit{20%{transform:translate(4px,-3px)}40%{transform:translate(-4px,3px)}60%{transform:translate(3px,2px)}80%{transform:translate(-2px,-2px)}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes sl{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes ty{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(-4px -4px -4px 0)}}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-40deg)}to{opacity:1;transform:rotate(-8deg)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-2deg) scale(1.05)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes jump{0%,91%{transform:none}92%{transform:translate(0,-7px)}93%{transform:translate(5px,4px)}94%{transform:none}96%{transform:translate(-3px,0)}97%{transform:none}}
}
