<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">Ana Arezo, Lead Front End Engineer</title>
<desc id="d">A film title card with a clapperboard whose slate is written in TypeScript. React, React Native and TypeScript. Here's looking at you, code.</desc>
<defs><pattern id="pf" width="40" height="26" patternUnits="userSpaceOnUse"><rect width="40" height="26" fill="#15110e"/><rect x="11" y="6" width="18" height="14" rx="3" fill="#f2e6c9"/></pattern>
<clipPath id="r"><rect width="1000" height="360" rx="16"/></clipPath>
<pattern id="st" width="48" height="30" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="48" height="30" fill="#14100d"/><rect width="24" height="30" fill="#f7efe0"/></pattern>
<radialGradient id="gw"><stop offset="0" stop-color="#e8b64c" stop-opacity=".3"/><stop offset="1" stop-color="#e8b64c" stop-opacity="0"/></radialGradient>
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<style>
.e{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.32em;fill:#e8b64c}
.n{font:700 62px Georgia,'Times New Roman',serif;fill:#f7efe0}.r{font:italic 400 24px Georgia,'Times New Roman',serif;fill:#e8b64c}.u{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c2b59e}
.w{font:600 15px 'Courier New',Courier,ui-monospace,monospace;fill:#c2b59e}
.c{font:600 13px 'Courier New',Courier,ui-monospace,monospace;fill:#f7efe0}.s{fill:#f3d08a}.k{fill:#ef6a5f}.p{fill:#8fd3c7}
.f{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.14em;fill:#c2b59e}
.stick{transform-origin:520px 69px}.dust,.cur{opacity:0}.ld{display:none}.d{font:700 150px Georgia,'Times New Roman',serif;fill:#f2e6c9;opacity:0}.sw{transform-origin:500px 180px}
@media (prefers-reduced-motion:no-preference){
.reel{animation:reel 3.5s linear infinite}
.fk{animation:fk 5s steps(9) infinite}
.h{animation:in .8s ease-out 2.7s both}.h2{animation-delay:2.9s}.h3{animation-delay:3.1s}.h4{animation-delay:3.3s}
.ty{animation-name:ty;animation-fill-mode:both}
.stick{animation:clap 12s ease-in 2.6s infinite both}
.wv{animation:wv .7s steps(1) infinite}
.dust{animation:dust linear infinite}
.ld{display:inline;animation:ldout .4s ease-out 2.4s forwards}
.sw{animation:sw .8s linear 3}
.d{animation:ds .8s linear forwards}
.cur{animation:bl 1s linear infinite}
@keyframes reel{to{transform:translateX(-40px)}}
@keyframes fk{0%,100%{opacity:1}30%{opacity:.82}55%{opacity:.95}75%{opacity:.78}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes clap{0%,6%{transform:rotate(-5deg)}9%,90%{transform:rotate(0)}93%,100%{transform:rotate(-5deg)}}
@keyframes ty{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(-4px -4px -4px 0)}}
@keyframes wv{0%{transform:none}25%{transform:translate(.5px,-.5px)}50%{transform:translate(-.4px,.4px)}75%{transform:translate(.3px,.5px)}}
@keyframes dust{0%{opacity:0;transform:none}20%{opacity:.75}80%{opacity:.5}100%{opacity:0;transform:translate(var(--x),var(--y))}}
@keyframes ldout{to{opacity:0;visibility:hidden}}
@keyframes sw{to{transform:rotate(360deg)}}
@keyframes ds{0%,99%{opacity:1}100%{opacity:0}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="360" fill="#0b0908"/>
<ellipse class="fk" cx="250" cy="180" rx="360" ry="210" fill="url(#gw)"/>
<rect width="1000" height="360" filter="url(#gr)" opacity=".07"/>
<rect class="reel" width="1080" height="26" fill="url(#pf)"/>
<rect class="reel" y="334" width="1080" height="26" fill="url(#pf)"/>
</g>
<circle class="dust" cx="866" cy="142" r="1.7" fill="#e8b64c" style="--x:35px;--y:-86px;animation-duration:12.4s;animation-delay:-2.0s"/><circle class="dust" cx="60" cy="288" r="1.8" fill="#e8b64c" style="--x:-7px;--y:-42px;animation-duration:11.7s;animation-delay:-6.4s"/><circle class="dust" cx="302" cy="84" r="1.5" fill="#e8b64c" style="--x:-47px;--y:-78px;animation-duration:8.9s;animation-delay:-1.9s"/><circle class="dust" cx="148" cy="167" r="1.1" fill="#e8b64c" style="--x:20px;--y:-53px;animation-duration:13.2s;animation-delay:-12.6s"/><circle class="dust" cx="134" cy="230" r="0.9" fill="#e8b64c" style="--x:-37px;--y:-34px;animation-duration:10.3s;animation-delay:-11.3s"/><circle class="dust" cx="938" cy="240" r="1.4" fill="#e8b64c" style="--x:12px;--y:-50px;animation-duration:8.3s;animation-delay:-7.3s"/><circle class="dust" cx="317" cy="215" r="1.2" fill="#e8b64c" style="--x:69px;--y:-71px;animation-duration:9.3s;animation-delay:-5.7s"/><circle class="dust" cx="855" cy="166" r="0.9" fill="#e8b64c" style="--x:-11px;--y:-64px;animation-duration:8.8s;animation-delay:-9.5s"/><circle class="dust" cx="485" cy="303" r="1.1" fill="#e8b64c" style="--x:-67px;--y:-69px;animation-duration:8.9s;animation-delay:-10.5s"/><circle class="dust" cx="486" cy="299" r="1.3" fill="#e8b64c" style="--x:18px;--y:-71px;animation-duration:12.1s;animation-delay:-0.6s"/><circle class="dust" cx="425" cy="153" r="1.4" fill="#e8b64c" style="--x:50px;--y:-77px;animation-duration:8.8s;animation-delay:-5.7s"/><circle class="dust" cx="106" cy="99" r="0.9" fill="#e8b64c" style="--x:59px;--y:-54px;animation-duration:9.3s;animation-delay:-8.7s"/><circle class="dust" cx="811" cy="187" r="1.2" fill="#e8b64c" style="--x:-66px;--y:-56px;animation-duration:13.9s;animation-delay:-4.8s"/><circle class="dust" cx="365" cy="290" r="1.8" fill="#e8b64c" style="--x:15px;--y:-71px;animation-duration:8.7s;animation-delay:-4.6s"/><circle class="dust" cx="868" cy="225" r="1.8" fill="#e8b64c" style="--x:-56px;--y:-61px;animation-duration:10.2s;animation-delay:-11.1s"/><circle class="dust" cx="698" cy="290" r="1.8" fill="#e8b64c" style="--x:59px;--y:-66px;animation-duration:12.9s;animation-delay:-7.3s"/><circle class="dust" cx="671" cy="158" r="1.5" fill="#e8b64c" style="--x:-20px;--y:-61px;animation-duration:9.6s;animation-delay:-9.3s"/><circle class="dust" cx="503" cy="177" r="1.0" fill="#e8b64c" style="--x:45px;--y:-43px;animation-duration:9.1s;animation-delay:-2.7s"/><circle class="dust" cx="360" cy="157" r="1.6" fill="#e8b64c" style="--x:-48px;--y:-47px;animation-duration:13.6s;animation-delay:-2.2s"/><circle class="dust" cx="430" cy="308" r="1.4" fill="#e8b64c" style="--x:-34px;--y:-51px;animation-duration:13.7s;animation-delay:-11.4s"/><circle class="dust" cx="313" cy="269" r="1.7" fill="#e8b64c" style="--x:1px;--y:-30px;animation-duration:11.6s;animation-delay:-7.3s"/><circle class="dust" cx="219" cy="139" r="1.2" fill="#e8b64c" style="--x:66px;--y:-63px;animation-duration:13.4s;animation-delay:-10.4s"/>
<rect x=".5" y=".5" width="999" height="359" rx="16" fill="none" stroke="#e8b64c" stroke-opacity=".35"/>
<g class="wv">
<text class="e h" x="50" y="104">A FRONT END PRODUCTION</text>
<text class="n h h2" x="48" y="168">Ana Arezo</text>
<text class="r h h3" x="50" y="208">Lead Front End Engineer</text>
<text class="u h h3" x="50" y="240">React · React Native · TypeScript</text>
<text class="w h h4" x="50" y="282">// here's looking at you, code</text>
</g>
<rect x="520" y="72" width="440" height="244" rx="8" fill="#15110e" stroke="#e8b64c" stroke-opacity=".45"/>
<text class="f" x="544" y="98">ROLL ana.ts</text><text class="f" x="704" y="98">SCENE 1</text><text class="f" x="840" y="98">TAKE 1</text>
<line x1="520" y1="110" x2="960" y2="110" stroke="#e8b64c" stroke-opacity=".45"/>
<text class="c ty" x="544" y="134" style="animation-delay:3.50s;animation-duration:0.33s;animation-timing-function:steps(15)" xml:space="preserve"><tspan class="k">const</tspan> slate = {</text>
<text class="c ty" x="544" y="157" style="animation-delay:3.89s;animation-duration:0.77s;animation-timing-function:steps(35)" xml:space="preserve">  <tspan class="p">title</tspan>: <tspan class="s">"Lead Front End Engineer"</tspan>,</text>
<text class="c ty" x="544" y="180" style="animation-delay:4.72s;animation-duration:0.46s;animation-timing-function:steps(21)" xml:space="preserve">  <tspan class="p">studio</tspan>: <tspan class="s">"Curation"</tspan>,</text>
<text class="c ty" x="544" y="203" style="animation-delay:5.24s;animation-duration:0.55s;animation-timing-function:steps(25)" xml:space="preserve">  <tspan class="p">location</tspan>: <tspan class="s">"London, UK"</tspan>,</text>
<text class="c ty" x="544" y="226" style="animation-delay:5.85s;animation-duration:1.06s;animation-timing-function:steps(48)" xml:space="preserve">  <tspan class="p">cast</tspan>: [<tspan class="s">"React"</tspan>, <tspan class="s">"React Native"</tspan>, <tspan class="s">"TypeScript"</tspan>],</text>
<text class="c ty" x="544" y="249" style="animation-delay:6.97s;animation-duration:0.95s;animation-timing-function:steps(43)" xml:space="preserve">  <tspan class="p">genre</tspan>: [<tspan class="s">"accessibility"</tspan>, <tspan class="s">"mobile"</tspan>, <tspan class="s">"AI"</tspan>],</text>
<text class="c ty" x="544" y="272" style="animation-delay:7.97s;animation-duration:0.51s;animation-timing-function:steps(23)" xml:space="preserve">  <tspan class="p">runtime</tspan>: <tspan class="s">"16+ years"</tspan>,</text>
<text class="c ty" x="544" y="295" style="animation-delay:8.54s;animation-duration:0.04s;animation-timing-function:steps(2)" xml:space="preserve">};</text>
<g class="stick"><rect x="520" y="39" width="440" height="30" rx="4" fill="url(#st)" stroke="#e8b64c" stroke-opacity=".45"/></g>
<circle cx="532" cy="70" r="4" fill="#e8b64c"/>
<rect class="cur" x="566" y="293" width="8" height="2" fill="#e8b64c" style="animation-delay:8.64s"/>
<g class="ld" clip-path="url(#r)" aria-hidden="true"><rect width="1000" height="360" fill="#1a1510"/>
<g fill="none" stroke="#f2e6c9" stroke-opacity=".55"><line x1="0" y1="180" x2="1000" y2="180"/><line x1="500" y1="0" x2="500" y2="360"/><circle cx="500" cy="180" r="150" stroke-width="3"/><circle cx="500" cy="180" r="124"/></g>
<line class="sw" x1="500" y1="180" x2="500" y2="30" stroke="#e8b64c" stroke-width="4"/><text class="d" x="500" y="224" text-anchor="middle" style="animation-delay:0.0s">3</text><text class="d" x="500" y="224" text-anchor="middle" style="animation-delay:0.8s">2</text><text class="d" x="500" y="224" text-anchor="middle" style="animation-delay:1.6s">1</text></g>
</svg>
