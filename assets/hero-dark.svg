<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">Ana Arezo, Software Engineer</title>
<desc id="d">A grindhouse film title card in black, yellow and red, beside a code panel. React, React Native and TypeScript. 16+ years.</desc>
<defs><clipPath id="r"><rect width="1000" height="360" rx="14"/></clipPath>
<radialGradient id="bn"><stop offset="0" stop-color="#fff6d0"/><stop offset=".45" stop-color="#ff9a1f"/><stop offset=".8" stop-color="#d7261e"/><stop offset="1" stop-color="#d7261e" stop-opacity="0"/></radialGradient>
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
<style>
.e{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.34em;fill:#f5c518}
.n{font:400 98px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.01em;fill:#f5c518}.r{font:400 26px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.06em;fill:#fff}
.u{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#d9d2bb}.w{font:700 15px 'Courier New',Courier,ui-monospace,monospace;fill:#d9d2bb}
.c{font:700 13px 'Courier New',Courier,ui-monospace,monospace;fill:#201800}.s{fill:#7a0f08}.k{fill:#a5120b}.p{fill:#000000}
.f{font:400 20px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.08em;fill:#201800}.fm{font:700 12px 'Courier New',Courier,ui-monospace,monospace;fill:#201800}
.b1{font:400 30px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;fill:#fff}.b2{font:400 13px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.1em;fill:#fff}
.lt{font:400 72px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;fill:#f5c518;letter-spacing:.03em}.ls{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.4em;fill:#f5efd8}
.wr,.cur{opacity:0}.ld{display:none}.st{transform-origin:912px 286px}.ng{transform-origin:48px 170px}.rb{transform-origin:48px 210px}.bn{transform-origin:500px 180px}
@media (prefers-reduced-motion:no-preference){
.wr{animation:wr 3.6s ease-in-out infinite}
.fk{animation:fk 10s ease-in-out infinite}
.ld{display:inline;animation:ldout .5s ease-out 3s forwards}
.lf{animation:lf 2.4s ease-in-out infinite}
.bn{animation:bn 1.3s ease-in 2s both}
.ng{animation:slam .8s ease-out 3.2s both}
.e{animation:in .7s ease-out 3.6s both}
.rb{animation:sl .8s ease-out 3.8s both}
.h3{animation:in .7s ease-out 4.2s both}.h4{animation:in .7s ease-out 4.5s both}
.ty{animation-name:ty;animation-fill-mode:both}
.st{animation:stamp .8s ease-out 11.25s both,wob 9s ease-in-out 12.05s infinite}
.cur{animation:bl 1.8s linear 11.25s infinite}
.jump{animation:jump 40s ease-in-out 15s infinite}
@keyframes wr{0%,40%,100%{opacity:0}20%{opacity:.7}}
@keyframes fk{0%,100%{opacity:1}50%{opacity:.95}}
@keyframes ldout{to{opacity:0;visibility:hidden}}
@keyframes lf{50%{opacity:.85}}
@keyframes bn{from{transform:scale(0)}to{transform:scale(9)}}
@keyframes slam{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes sl{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes ty{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(-4px -4px -4px 0)}}
@keyframes stamp{from{opacity:0;transform:scale(1.3) rotate(-14deg)}to{opacity:1;transform:rotate(-8deg)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-5deg)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes jump{0%,97%,100%{transform:none}98.5%{transform:translate(1px,-2px)}}
}
</style>
