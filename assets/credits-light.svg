<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="t">
<title id="t">End credits. Directed by Ana Arezo. Produced at Curation. Filmed on location in London, UK. Starring Ana Arezo, React Native and React. Styled with Tailwind CSS. Tested with Vitest and Jest. Fuelled by a perfectly brewed cup of tea. That's a wrap.</title>
